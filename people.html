<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCALE Lab</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="assets/style.css?v=member-data-json-3" />
  <style>
    [data-page="people"] { --people-primary:#6366f1; --people-primary-weak:#eef2ff; }
    @media (prefers-color-scheme: dark) { [data-page="people"] { --people-primary:#818cf8; --people-primary-weak:#1e1b4b; } }
    .section { padding-top: 24px; padding-bottom: 48px; }
    .member-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px; margin-bottom:30px; }
    .member-card { display:flex; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:box-shadow .2s; min-height:108px; }
    .member-card:hover { box-shadow:var(--shadow); }
    .member-card-photo, .member-card-photo-placeholder { width:88px; min-width:88px; height:108px; object-fit:cover; object-position:top; display:block; }
    .member-card-photo-placeholder { background:var(--people-primary-weak); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:1.6rem; flex-shrink:0; }
    .member-card-body { padding:10px 14px; flex:1; }
    .member-card-name { font-size:.98rem; font-weight:700; color:var(--fg); margin-bottom:1px; line-height:1.25; }
    .member-card-name-en { font-size:.82rem; color:var(--muted); margin-bottom:6px; line-height:1.25; }
    .member-card-degree, .member-degree { display:inline-block; padding:1px 8px; border-radius:8px; font-size:.72rem; font-weight:600; line-height:1.45; }
    .member-card-degree { margin-bottom:4px; }
    .member-degree { margin-top:4px; }
    .member-card-email { display:flex; align-items:center; gap:5px; font-size:.78rem; color:var(--people-primary); text-decoration:none; word-break:break-all; margin-top:3px; line-height:1.25; }
    .people-table { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:14px; margin-bottom:32px; }
    .people-table table { width:100%; border-collapse:collapse; }
    .people-table tbody tr:hover { background:var(--people-primary-weak); }
    .people-table tbody tr:last-child td { border-bottom:none; }
    .people-table td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--fg); font-size:.88rem; vertical-align:middle; line-height:1.35; }
    .td-name { width:170px; font-weight:600; }
    .degree-phd { background:color-mix(in oklab,var(--people-primary) 15%,transparent); color:var(--people-primary); }
    .degree-ms { background:color-mix(in oklab,var(--people-primary) 10%,transparent); color:var(--people-primary); }
    .td-thesis { color:var(--fg); line-height:1.35; }
    .td-thesis em { display:block; color:var(--muted); font-size:.82rem; margin-top:2px; line-height:1.35; }
    .td-position { width:190px; color:var(--muted); font-size:.84rem; }
    .section-label { margin-top:30px; margin-bottom:0; color:var(--fg); font-size:1.55rem; font-weight:800; }
    .section-label:first-of-type { margin-top:0; }
    @media (max-width:900px) { .member-grid { grid-template-columns:1fr; } }
    @media (max-width:768px) { .section { padding-top:18px; padding-bottom:36px; } .member-grid { gap:10px; margin-top:12px; margin-bottom:26px; } .people-table { overflow-x:auto; } .people-table table { min-width:620px; } .member-card-photo, .member-card-photo-placeholder { width:76px; min-width:76px; height:96px; } .member-card { min-height:96px; } .member-card-body { padding:9px 12px; } }
  </style>
</head>
<body data-page="people">
  <header></header>
  <section class="section">
    <div class="container">
      <h3 class="section-label">Ph.D Students</h3>
      <div class="member-grid" id="phd-grid"></div>
      <h3 class="section-label">Master Studnets</h3>
      <div class="member-grid" id="current-grid"></div>
      <h3 class="section-label">Alumni</h3>
      <div class="people-table"><table><tbody id="alumni-tbody"></tbody></table></div>
    </div>
  </section>
  <footer></footer>
  <script src="assets/script.js?v=member-data-json-3"></script>
  <script>
    function degreeClass(deg) { return deg === 'Ph.D.' ? 'degree-phd' : 'degree-ms'; }
    function yearValue(y) { const n = parseFloat(String(y).replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; }
    function sortByYearDesc(list) { return [...list].sort((a, b) => yearValue(b.year) - yearValue(a.year)); }

    function renderCurrent(members) {
      return members.map(m => {
        const photoHTML = m.photo ? `<img class="member-card-photo" src="${m.photo}" alt="${m.name}" onerror="this.outerHTML='<div class=\\'member-card-photo-placeholder\\'>👤</div>'">` : `<div class="member-card-photo-placeholder">👤</div>`;
        const nameEnHTML = m.name_en ? `<div class="member-card-name-en">${m.name_en}</div>` : '';
        const emailHTML = m.email ? `<a class="member-card-email" href="mailto:${m.email}">✉ ${m.email}</a>` : '';
        return `<div class="member-card">${photoHTML}<div class="member-card-body"><div class="member-card-name">${m.name}</div>${nameEnHTML}<span class="member-card-degree ${degreeClass(m.degree)}">${m.degree}</span>${emailHTML}</div></div>`;
      }).join('');
    }

    function renderAlumni(alumni) {
      return alumni.map(a => `<tr><td class="td-name">${a.name}<br><span class="member-degree ${degreeClass(a.degree)}">${a.degree} ${a.year}</span></td><td class="td-thesis">${a.thesis_zh || ''}<em>${a.thesis_en || ''}</em></td><td class="td-position">${a.position || ''}</td></tr>`).join('');
    }

    fetch('assets/people-data.json?v=member-data-json-3', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Failed to load people-data.json'); return r.json(); })
      .then(data => {
        document.getElementById('phd-grid').innerHTML = renderCurrent(data.phd || []);
        document.getElementById('current-grid').innerHTML = renderCurrent(data.current || []);
        document.getElementById('alumni-tbody').innerHTML = renderAlumni(sortByYearDesc(data.alumni || []));
      })
      .catch(err => {
        console.error(err);
        document.getElementById('current-grid').innerHTML = '<p class="muted">Member data failed to load.</p>';
      });
  </script>
</body>
</html>
