<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member · SCALE Lab</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="assets/style.css?v=member-fix-2" />
  <style>
    [data-page="people"] { --people-primary:#6366f1; --people-primary-weak:#eef2ff; }
    @media (prefers-color-scheme: dark) { [data-page="people"] { --people-primary:#818cf8; --people-primary-weak:#1e1b4b; } }
    .member-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:24px; margin-bottom:48px; }
    .member-card { display:flex; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:box-shadow .2s; }
    .member-card:hover { box-shadow:var(--shadow); }
    .member-card-photo, .member-card-photo-placeholder { width:130px; min-width:130px; height:160px; object-fit:cover; object-position:top; display:block; }
    .member-card-photo-placeholder { background:var(--people-primary-weak); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:2.2rem; flex-shrink:0; }
    .member-card-body { padding:20px 24px; flex:1; }
    .member-card-name { font-size:1.05rem; font-weight:700; color:var(--fg); margin-bottom:2px; }
    .member-card-name-en { font-size:.9rem; color:var(--muted); margin-bottom:10px; }
    .member-card-degree, .member-degree { display:inline-block; padding:2px 10px; border-radius:10px; font-size:.78rem; font-weight:600; }
    .member-card-degree { margin-bottom:10px; }
    .member-degree { margin-top:6px; }
    .member-card-email { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--people-primary); text-decoration:none; word-break:break-all; margin-top:4px; }
    .people-table { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:24px; margin-bottom:48px; }
    .people-table table { width:100%; border-collapse:collapse; }
    .people-table tbody tr:hover { background:var(--people-primary-weak); }
    .people-table tbody tr:last-child td { border-bottom:none; }
    .people-table td { padding:16px; border-bottom:1px solid var(--border); color:var(--fg); font-size:.95rem; vertical-align:middle; }
    .td-name { width:190px; font-weight:600; }
    .degree-phd { background:color-mix(in oklab,var(--people-primary) 15%,transparent); color:var(--people-primary); }
    .degree-ms { background:color-mix(in oklab,var(--people-primary) 10%,transparent); color:var(--people-primary); }
    .td-thesis { color:var(--fg); line-height:1.5; }
    .td-thesis em { display:block; color:var(--muted); font-size:.88rem; margin-top:4px; }
    .td-position { width:210px; color:var(--muted); font-size:.9rem; }
    .section-label { margin-top:48px; margin-bottom:0; color:var(--fg); }
    @media (max-width:900px) { .member-grid { grid-template-columns:1fr; } }
    @media (max-width:768px) { .people-table { overflow-x:auto; } .people-table table { min-width:620px; } .member-card-photo, .member-card-photo-placeholder { width:100px; min-width:100px; height:130px; } }
  </style>
</head>
<body data-page="people">
  <header></header>
  <section class="section">
    <div class="container">
      <h2>Member</h2>
      <p class="lead">Our research team members and their career destinations.</p>
      <h3 class="section-label">Current Students</h3>
      <div class="member-grid" id="current-grid"></div>
      <h3 class="section-label">Alumni</h3>
      <div class="people-table"><table><tbody id="alumni-tbody"></tbody></table></div>
    </div>
  </section>
  <footer></footer>
  <script src="assets/script.js?v=member-fix-2"></script>
  <script>
    const oldPageAlumni = [
      { name:'盧緯 Wei Lu', degree:'Ph.D.', year:'2025.02', thesis_zh:'結合三維靜態記憶體與嵌入式主動橋接晶片組之彈性節能連線架構並應用於記憶體密集型人工智慧', thesis_en:'Flexible and Energy-Efficient Interconnection Architectures with 3D-SRAM and Embedded Active bridge Chipset for Memory-intensive AI applications', position:'NYCU, Post-doc' },
      { name:'藍芸平 Yvette Lan', degree:'M.S.', year:'2021', thesis_zh:'利用晶粒方向容忍設計方法實現單晶粒島區之積層型三維靜態隨機存取記憶體及電壓穩壓器', thesis_en:'Crystal-orientation-Tolerant Design Techniques for Monolithic 3D SRAM and LDO with Single-Crystal-Islands', position:'MediaTek (聯發科技)' },
      { name:'張宇閎 Alex Chang', degree:'M.S.', year:'2021', thesis_zh:'應用於低成本矽或玻璃中介層晶片間通信之感知匯流排編碼方法', thesis_en:'Cognitive Bus Coding Scheme for Inter-Chip Communications on Low-cost Si or Glass Interposers', position:'MediaTek (聯發科技)' },
      { name:'楊昀儒 Yun-Ru Yang', degree:'M.S.', year:'2021', thesis_zh:'基於自適應浮點數以及數位記憶體運算之節能深度神經網路加速電路設計', thesis_en:'Energy-Efficient Digital Computation-in-Memory Design with Adaptive Floating Point for Deep Neural Networks', position:'MediaTek (聯發科技)' },
      { name:'管偉傑 Wei-Jie Kuan', degree:'M.S.', year:'2021', thesis_zh:'利用跨平台加速框架實現快速初期預測性擺置器', thesis_en:'Fast Early-phase Predictive Placer Using Cross-platform Acceleration Framework', position:'Synopsys (美商新思科技)' },
      { name:'張仕傑 Shih-Jie Chang', degree:'M.S.', year:'2021', thesis_zh:'藉由區域性電流預測主動式去耦合電容技術實現三維積體電路電源雜訊動態抑制', thesis_en:'Active DECAPs with Region-based Current Prediction for Dynamic Noise Suppression in TSV 3DICs', position:'DTP/TSMC (Design Technology Platform/台積電)' },
      { name:'高瑞憶 Jui-I Kao', degree:'M.S.', year:'2021', thesis_zh:'應用於混合數位及記憶體內運算卷積神經網路加速電路之精準度感知工作分配及資料排程技術', thesis_en:'Precision-Aware Workload Distribution and Dataflow for a Hybrid Digital-CIM Deep CNN Accelerator', position:'Phison (群聯電子)' },
      { name:'溫紹成 Shao-Chern Wen', degree:'M.S.', year:'2021', thesis_zh:'', thesis_en:'Design Exploration of An Energy-Efficient Acceleration System for CNNs on Low-Cost Resource-Constraint SoC-FPGAs', position:'MediaTek (聯發科技)' },
      { name:'Sunanda Thunder', degree:'M.S.', year:'2021', thesis_zh:'應用於新興記憶體內運算電路之具變異容忍深度學習訓練框架', thesis_en:'A Variation-Tolerant Deep Learning Training Framework for Emerging Computation-in-Memory Circuits', position:'Ph.D. in École centrale de Lyon, France' },
      { name:'Amit Sravan', degree:'M.S.', year:'2020', thesis_zh:'', thesis_en:'OFDM-based Baseband Processor for Wide-band Frequency Hopping with RF-sampling ADC', position:'Ph.D. in Monash University, Australia' },
      { name:'盧緯 Wei Lu', degree:'M.S.', year:'2020.09', thesis_zh:'利用交叉環狀連線網路架構與3D堆疊靜態記憶體實現CNN-LSTM神經網路節能加速器', thesis_en:'An Energy-Efficient Accelerator using Cross-Ring Interconnection Architecture with 3D-SRAM for Hybrid CNN-LSTM Network', position:'Ph.D. in National Yang Ming Chiao Tung University (NYCU)' },
      { name:'劉廷威 Ting-Wei Liu', degree:'M.S.', year:'2020', thesis_zh:'具能源及面積效益記憶體內運算使用高線性鎳結晶電阻式記憶體之深度神經網路加速器設計', thesis_en:'Energy/Area-Efficient Computation-in-Memory Accelerator Design Using High-Linearity Ni-Crystal RRAM for Deep Neural Networks', position:'MediaTek (聯發科技)' },
      { name:'蔡宗函 Chung-Han Tsai', degree:'M.S.', year:'2020', thesis_zh:'應用於三維矽穿孔積體電路之主動式去耦電容電源雜訊抑制方法', thesis_en:'Power Noise Suppression Design Methodology using Active Decoupling Capacitors for TSV 3DIC', position:'NovaTek (聯詠科技)' },
      { name:'鄭之翔 Chi-Hsiang Cheng', degree:'M.S.', year:'2020', thesis_zh:'為稀疏特性的2D-FFT在mmWave雷達系統設計之高壓縮率轉置記憶體控制電路', thesis_en:'High-Compression Transpose Memory for Sparse 2D-FFT in mmWave Radar Applications', position:'Avery Design Systems (美商亞睿系統設計)' },
      { name:'賴冠甫 Kuan-Fu Lai', degree:'M.S.', year:'2020', thesis_zh:'應用於晶內電源傳遞網路之晶向變異容忍積層型三維電源穩壓器', thesis_en:'Crystal-Orientation-Tolerant Voltage Regulator using Monolithic 3D BEOL FinFETs in Single-Crystal Islands for On-Chip Power Delivery Network', position:'Phison (群聯電子)' },
      { name:'張豔怜 Yan-Ling Chang', degree:'M.S.', year:'2020', thesis_zh:'具製程變異容忍之積層型三維鰭式場效電晶體增壓緩衝器電路設計', thesis_en:'Variation-Tolerant Capacitive Boosted Buffer Design using Monolithic 3D-IC BEOL FinFETs', position:'MediaTek (聯發科技)' },
      { name:'陳俊良 Chun-Liang Chen', degree:'M.S.', year:'2019', thesis_zh:'利用積層型三維積體電路實現混合搜尋之快速響應數位線性穩壓器', thesis_en:'A Fast-Response Hybrid-Searching Fully-Integrated LDO using Monolithic 3D IC Technology', position:'Realtek (瑞昱半導體)' },
      { name:'吳婉琪 Wan-Chi Wu', degree:'M.S.', year:'2019', thesis_zh:'積層型三維靜態隨機存取記憶體之變異分析及三維讀寫輔助電路設計', thesis_en:'SRAM Variation Analysis and Peripheral R/W-Assist Circuits using Monolithic 3D BEOL FinFET Circuits', position:'MediaTek (聯發科技)' },
      { name:'羅進陽 Chin-Yang Lo', degree:'M.S.', year:'2019', thesis_zh:'利用三維靜態記憶體及環狀架構之輕量化稀疏卷積神經網路加速器設計', thesis_en:'Energy-Efficient Ring-Based Accelerator Design with 3D-SRAM for Compact Sparse CNN', position:'NovaTek (聯詠科技)' },
      { name:'高公鑠 Kung-Shuo Kao', degree:'M.S.', year:'2019', thesis_zh:'應用於高速毫米雷達之可變點數稀疏快速傅立葉轉換加速器設計', thesis_en:'Variable-length Sparse 2D Fast Fourier Transform Accelerator for High-Speed mmWave Radar Applications', position:'MediaTek (聯發科技)' },
      { name:'陳以晉 Yi-Jing Chen', degree:'M.S.', year:'2019', thesis_zh:'利用積層型三維積體電路實現具分時及雙邊緣觸發技術之快速響應數位線性穩壓器', thesis_en:'Fast-Response Digital Linear Voltage Regulator with Time-Sharing and Double-Edge-Triggered Techniques using Monolithic 3D IC', position:'MediaTek (聯發科技)' },
      { name:'葛佩玉 Pei-Yu Ge', degree:'M.S.', year:'2018', thesis_zh:'', thesis_en:'Energy-Efficient Fusion-Based Deep Neural Networks Acceleration with 3-D Network-on-Chip', position:'MediaTek (聯發科技)' },
      { name:'吳易真 I-Chen Wu', degree:'M.S.', year:'2018', thesis_zh:'', thesis_en:'Energy-Efficient Accelerator with Relative-Indexing Memory for Sparse Compressed CNN', position:'MediaTek (聯發科技)' },
      { name:'楊子鋐 Zhi-Hong Yang', degree:'M.S.', year:'2018', thesis_zh:'', thesis_en:'Resource-Constrained Design Exploration of CNN for Edge Computing Inferences', position:'Realtek (瑞昱半導體)' }
    ];

    function degreeClass(deg) { return deg === 'Ph.D.' ? 'degree-phd' : 'degree-ms'; }
    function yearValue(y) { const n = parseFloat(String(y).replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; }
    function sortByYearDesc(list) { return [...list].sort((a, b) => yearValue(b.year) - yearValue(a.year)); }
    function keyOf(a) { return `${String(a.name || '').split(' ')[0]}|${a.degree}|${String(a.year || '').slice(0,4)}`; }

    function renderCurrent(members) {
      return members.map(m => {
        const photoHTML = m.photo ? `<img class="member-card-photo" src="${m.photo}" alt="${m.name}" onerror="this.outerHTML='<div class=\\'member-card-photo-placeholder\\'>👤</div>'">` : `<div class="member-card-photo-placeholder">👤</div>`;
        const nameEnHTML = m.name_en ? `<div class="member-card-name-en">${m.name_en}</div>` : '';
        const emailHTML = m.email ? `<a class="member-card-email" href="mailto:${m.email}">✉ ${m.email}</a>` : '';
        return `<div class="member-card">${photoHTML}<div class="member-card-body"><div class="member-card-name">${m.name}</div>${nameEnHTML}<span class="member-card-degree ${degreeClass(m.degree)}">${m.degree}</span>${emailHTML}</div></div>`;
      }).join('');
    }

    function renderAlumni(alumni) {
      return alumni.map(a => `<tr><td class="td-name">${a.name}<br><span class="member-degree ${degreeClass(a.degree)}">${a.degree} ${a.year}</span></td><td class="td-thesis">${a.thesis_zh || ''}<em>${a.thesis_en || ''}</em></td><td class="td-position">${a.position || ''}</td></tr>`).join('');
    }

    fetch('assets/people-data.json?v=member-fix-2', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Failed to load people-data.json'); return r.json(); })
      .then(data => {
        const alumniKeys = new Set((data.alumni || []).map(keyOf));
        const mergedAlumni = [...oldPageAlumni.filter(a => !alumniKeys.has(keyOf(a))), ...(data.alumni || [])];
        document.getElementById('current-grid').innerHTML = renderCurrent(data.current || []);
        document.getElementById('alumni-tbody').innerHTML = renderAlumni(sortByYearDesc(mergedAlumni));
      })
      .catch(err => {
        console.error(err);
        document.getElementById('current-grid').innerHTML = '<p class="muted">Member data failed to load.</p>';
        document.getElementById('alumni-tbody').innerHTML = renderAlumni(sortByYearDesc(oldPageAlumni));
      });
  </script>
</body>
</html>
