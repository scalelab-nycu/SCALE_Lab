<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research · SCALE Lab</title>
  <meta name="color-scheme" content="light" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .section { padding-top: 28px; }
    .research-vision {
      margin-bottom: 24px; padding: 32px;
      background: var(--card); border: 3px solid #047857;
      border-radius: 12px;
    }
    .research-vision h3 { margin: 0 0 16px; color: var(--primary); font-size: 1.3rem; }
    .research-vision p { font-size: 1.05rem; line-height: 1.7; margin: 0; }
    .research-overview-figure {
      margin: 24px 0 0;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .research-overview-figure img,
    .research-image-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .research-image-frame {
      max-width: 920px;
      margin: 0 auto 32px;
      padding: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .research-image-frame:last-of-type { margin-bottom: 48px; }
    .research-image-title {
      margin: 0;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--primary-weak), #fff);
      border-bottom: 1px solid var(--border);
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .research-image-frame img { border-radius: 0 0 12px 12px; }
    .research-area { margin-bottom: 40px; }
    .area-header {
      background: linear-gradient(135deg, var(--primary-weak), var(--card));
      padding: 24px 32px; border-radius: 12px 12px 0 0;
      border: 1px solid var(--border); border-bottom: none;
    }
    .area-title { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin: 0; line-height: 1.3; }
    .area-subtitle { color: var(--muted); font-size: 1rem; margin: 8px 0 0; }
    .area-content { background: var(--card); border: 1px solid var(--border); border-radius: 0 0 12px 12px; padding: 32px; }
    .research-list { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
    .research-item {
      padding: 16px 20px; background: var(--bg); border-radius: 8px;
      border-left: 3px solid var(--primary); border: 1px solid var(--border); transition: all 0.2s ease;
    }
    .research-item:hover { transform: translateX(4px); box-shadow: var(--shadow); }
    .research-item-title { font-weight: 600; color: var(--fg); margin-bottom: 8px; font-size: 1rem; }
    .research-sublist { margin: 12px 0 0 20px; padding: 0; list-style: none; }
    .research-sublist li { margin-bottom: 8px; padding-left: 16px; position: relative; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .research-sublist li::before { content: "•"; color: var(--primary); position: absolute; left: 0; font-weight: bold; }
    .research-area.compact-items .research-list { gap: 4px; }
    .research-area.compact-items .research-item {
      padding: 4px 0 4px 18px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      position: relative;
    }
    .research-area.compact-items .research-item::before {
      content: "•";
      position: absolute;
      left: 0;
      top: 4px;
      color: var(--primary);
      font-weight: 700;
    }
    .research-area.compact-items .research-item:hover { transform: none; box-shadow: none; }
    .research-area.compact-items .research-item-title { margin-bottom: 0; font-weight: 500; line-height: 1.45; }
    @media (max-width: 880px) {
      .section { padding-top: 20px; }
      .research-vision { padding: 24px 20px; }
      .area-header { padding: 20px 24px; }
      .area-content { padding: 24px 20px; }
      .research-item { padding: 14px 16px; }
      .research-overview-figure { padding: 6px; }
      .research-image-frame { max-width: 100%; }
      .research-image-title { padding: 12px 14px; font-size: 1.15rem; }
      .research-area.compact-items .research-item { padding: 4px 0 4px 18px; }
    }
  </style>
</head>
<body data-page="research">
  <header></header>

  <section class="section">
    <div class="container">
      <h2>Research Interests</h2>
      <div id="research-content"></div>
    </div>
  </section>

  <footer></footer>
  <script src="assets/script.js"></script>
  <script>
    fetch('assets/research-data.json')
      .then(r => r.json())
      .then(d => {
        const areas = d.areas.map(area => {
          const compactClass = area.title === 'SoC/SiP Architecture/Platform' ? ' compact-items' : '';
          const items = area.items.map(item => {
            const bullets = item.bullets.length
              ? `<ul class="research-sublist">${item.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`
              : '';
            return `
              <li class="research-item">
                <div class="research-item-title">${item.title}</div>
                ${bullets}
              </li>`;
          }).join('');

          return `
            <div class="research-area${compactClass}">
              <div class="area-header">
                <h3 class="area-title">${area.title}</h3>
                <div class="area-subtitle">${area.subtitle}</div>
              </div>
              <div class="area-content">
                <ul class="research-list">${items}</ul>
              </div>
            </div>`;
        }).join('');

        document.getElementById('research-content').innerHTML = `
          <div class="research-vision">
            <h3>Research Goal</h3>
            <p>${d.goal}</p>
            <figure class="research-overview-figure">
              <img src="assets/images/research_overview.png" alt="Sustainable memory-centric computing research overview">
            </figure>
          </div>
          <figure class="research-image-frame">
            <figcaption class="research-image-title">3D-Aware Design Methodologies</figcaption>
            <img src="assets/images/research_1_3D_aware.png" alt="3D-Aware Design Methodologies for TSV Monolithic and Thin-3D Integration">
          </figure>
          <figure class="research-image-frame">
            <figcaption class="research-image-title">Memory Sub-System with 3D-SRAM or 3D-DRAM</figcaption>
            <img src="assets/images/research_2_3D_memory.png" alt="Memory Sub-System with 3D-SRAM or 3D-DRAM">
          </figure>
          ${areas}`;
      })
      .catch(err => console.error('Failed to load research-data.json:', err));
  </script>
</body>
</html>
