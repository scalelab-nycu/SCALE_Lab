  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCALE Lab · Home</title>
  <meta name="description" content="Sustainable circuits & systems, carbon-aware co-optimization, and memory-centric computing." />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <style>
    main#snap {
      min-height: 100svh;
      overflow-y: visible;
      scroll-behavior: smooth;
    }
    section.panel {
      min-height: auto;
      display: grid;
      place-items: center;
      padding: 52px 6vw;
      position: relative;
      isolation: isolate;
    }
    section.panel.hero {
      min-height: 34svh;
      padding-top: 32px;
      padding-bottom: 20px;
    }
    .panel.hero {
      background:
        radial-gradient(1200px 600px at 20% 10%, color-mix(in oklab, var(--primary) 15%, transparent), transparent),
        radial-gradient(1000px 500px at 85% 20%, color-mix(in oklab, var(--primary) 10%, transparent), transparent);
    }
    .panel.alt {
      background: color-mix(in oklab, var(--card) 85%, transparent);
    }
    .panel .content {
      padding: 14px 16px;
    }
    .panel h2 {
      margin-bottom: 8px;
    }
    .panel p,
    .panel ul {
      margin-top: 6px;
      margin-bottom: 8px;
    }
    .about-layout {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }
    .about-qr {
      width: 150px;
      height: 150px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: var(--shadow);
    }
    #aboutVision {
      white-space: normal;
      margin-bottom: 0;
      font-size: 1.15rem;
      line-height: 1.65;
    }
    #highlights {
      margin-top: 6px !important;
    }
    @media (max-width: 700px) {
      .about-layout {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .about-qr {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>

  <script>
    // Reveal-on-scroll
    const panels = Array.from(document.querySelectorAll('section.panel'));
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting && e.intersectionRatio > 0.5) {
          e.target.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
        }
      }
    }, { root: null, threshold: [0.5] });
    panels.forEach(p => io.observe(p));

    // Load lab vision & highlights
    loadSiteData().then(data => {
      document.getElementById('aboutVision').textContent = 'SCALE Lab was established by Prof. Po-Tsang Huang. ' + data.research.vision;

      const highlights = document.getElementById('highlights');
      const cards = [];

      for (const t of data.research.thrusts) {
        const top = t.bullets.slice(0,3).map(s => `<li>${s}</li>`).join('');

        cards.push(`
          <div class="col-6 card reveal">
            <div class="content">
              <h3>${t.title}</h3>
              <ul class="muted" style="text-align:left; margin-top:8px;">${top}</ul>
            </div>
          </div>`);
      }

      highlights.innerHTML = cards.join('');
    }).catch(console.error);
  </script>
